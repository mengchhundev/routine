# Development stack. Everything runs in containers, so the only host
# requirement is Docker: no JDK, Maven, Node or PostgreSQL install needed.
#
#   docker compose up --build     bring the whole stack up
#   docker compose logs -f api    follow the backend
#   docker compose down -v        stop and delete the database volume

name: routine

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-routine}
      POSTGRES_USER: ${POSTGRES_USER:-routine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-routine}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # The api container waits on this, so it never races the first migration.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-routine} -d ${POSTGRES_DB:-routine}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    # Not used by the MVP. It is here so reminder queues, rate limiting and
    # dashboard caching have somewhere to land without a compose change later.
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-routine}
      DB_USERNAME: ${POSTGRES_USER:-routine}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-routine}
      # Local-development key only. Compose substitutes ROUTINE_JWT_SECRET from
      # .env when set, so staging and production never see this value.
      ROUTINE_JWT_SECRET: ${ROUTINE_JWT_SECRET:-ZGV2LW9ubHktc2VjcmV0LWRvLW5vdC11c2UtaW4tcHJvZHVjdGlvbi0xMjM0NTY3OA==}
      ROUTINE_CORS_ORIGINS: ${ROUTINE_CORS_ORIGINS:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    environment:
      # Server-side calls go container-to-container; the browser never sees this.
      API_INTERNAL_URL: http://api:8080
      NEXT_PUBLIC_APP_URL: http://localhost:${WEB_PORT:-3000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      api:
        condition: service_started

  # ------------------------------------------------------------- testing ---
  # Started only by `make test` (compose profile "test"). On a tmpfs, so every
  # run migrates a genuinely empty database and nothing survives the container.
  postgres-test:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: routine_test
      POSTGRES_USER: routine
      POSTGRES_PASSWORD: routine
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routine -d routine_test"]
      interval: 3s
      timeout: 3s
      retries: 20

  test:
    build:
      context: ./backend
      dockerfile: Dockerfile.test
    profiles: ["test"]
    environment:
      TEST_DB_URL: jdbc:postgresql://postgres-test:5432/routine_test
      TEST_DB_USERNAME: routine
      TEST_DB_PASSWORD: routine
    volumes:
      - ./backend:/app
      - maven-cache:/root/.m2
    depends_on:
      postgres-test:
        condition: service_healthy

volumes:
  postgres-data:
  maven-cache:
